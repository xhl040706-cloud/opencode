name: publish

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      release:
        type: string
        required: true
      repo:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: false
      release:
        type: string
        required: false
      repo:
        type: string
        required: false

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  packages:
    runs-on: ubuntu-latest
    if: github.repository == 'zgsm-ai/opencode'
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-bun

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - uses: actions/download-artifact@v4
        with:
          name: opencode-cli
          path: packages/opencode/dist

      - name: Cache apt packages (AUR)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-aur-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-aur-

      - name: Setup SSH for AUR
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          git config --global user.email "opencode@sst.dev"
          git config --global user.name "opencode"
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - run: ./script/publish.ts
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_RELEASE: ${{ inputs.release }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ inputs.repo }}
          NPM_CONFIG_PROVENANCE: false

      - name: Publish to Homebrew tap
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          OPENCODE_VERSION: ${{ inputs.version }}
        run: |
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/zgsm-ai/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          git config user.email "opencode@sst.dev"
          git config user.name "opencode"

          # Calculate SHA256 for macOS binaries
          ARM64_SHA=$(sha256sum $GITHUB_WORKSPACE/packages/opencode/dist/opencode-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          X64_SHA=$(sha256sum $GITHUB_WORKSPACE/packages/opencode/dist/opencode-x86_64-apple-darwin.tar.gz | awk '{print $1}')

          # Update formula
          FORMULA_FILE=$(find . -name "*.rb" | head -1)
          sed -i "s|url \".*aarch64-apple-darwin.*\"|url \"https://github.com/zgsm-ai/opencode/releases/download/v${OPENCODE_VERSION}/opencode-aarch64-apple-darwin.tar.gz\"|g" "$FORMULA_FILE"
          sed -i "/aarch64-apple-darwin/{n; s/sha256 \".*\"/sha256 \"${ARM64_SHA}\"/}" "$FORMULA_FILE"
          sed -i "s|url \".*x86_64-apple-darwin.*\"|url \"https://github.com/zgsm-ai/opencode/releases/download/v${OPENCODE_VERSION}/opencode-x86_64-apple-darwin.tar.gz\"|g" "$FORMULA_FILE"
          sed -i "/x86_64-apple-darwin/{n; s/sha256 \".*\"/sha256 \"${X64_SHA}\"/}" "$FORMULA_FILE"

          git add -A
          git diff --staged --quiet || git commit -m "update opencode to v${OPENCODE_VERSION}"
          git push

      - name: Publish to Scoop bucket
        continue-on-error: true
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          OPENCODE_VERSION: ${{ inputs.version }}
        run: |
          git clone https://x-access-token:${SCOOP_BUCKET_TOKEN}@github.com/zgsm-ai/scoop-bucket.git /tmp/scoop-bucket
          cd /tmp/scoop-bucket
          git config user.email "opencode@sst.dev"
          git config user.name "opencode"

          # Calculate SHA256 for Windows binary
          WIN_SHA=$(sha256sum $GITHUB_WORKSPACE/packages/opencode/dist/opencode-x86_64-pc-windows-msvc.zip | awk '{print $1}')

          # Update manifest
          MANIFEST_FILE=$(find . -name "opencode.json" | head -1)
          if [ -z "$MANIFEST_FILE" ]; then
            MANIFEST_FILE="bucket/opencode.json"
            mkdir -p bucket
            echo '{}' > "$MANIFEST_FILE"
          fi

          # Update version and hash in manifest
          cat "$MANIFEST_FILE" | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          data['version'] = '${OPENCODE_VERSION}'
          data['url'] = 'https://github.com/zgsm-ai/opencode/releases/download/v${OPENCODE_VERSION}/opencode-x86_64-pc-windows-msvc.zip'
          data['hash'] = '${WIN_SHA}'
          print(json.dumps(data, indent=2))
          " > "$MANIFEST_FILE.tmp" && mv "$MANIFEST_FILE.tmp" "$MANIFEST_FILE"

          git add -A
          git diff --staged --quiet || git commit -m "update opencode to v${OPENCODE_VERSION}"
          git push
